<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Sources — ALSU Genomics DRAGEN Server</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;background:#f5f6f8;color:#1a1d23;line-height:1.5}
a{color:#2563eb;text-decoration:none}a:hover{text-decoration:underline}
.app{max-width:1100px;margin:0 auto;padding:24px 20px}
header{margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #e5e7eb;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px}
h1{font-size:20px;font-weight:700;color:#111}h1 span{color:#2563eb}
.back{font-size:12px;padding:5px 12px;border:1px solid #d1d5db;border-radius:4px;color:#374151;background:#fff}
.back:hover{border-color:#2563eb;color:#2563eb}
.sub{font-size:12px;color:#6b7280;margin-top:3px}
.srv{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:14px 18px;margin-bottom:20px;display:flex;gap:24px;flex-wrap:wrap}
.si{display:flex;flex-direction:column;gap:2px}
.sl{font-size:10px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.5px}
.sv{font-size:13px;color:#111;font-weight:600}
.sv.mono{font-family:"SF Mono","Fira Code",monospace;font-size:12px}
